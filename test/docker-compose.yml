services:
  postgres:
    image: postgres:16-alpine
    container_name: test-strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi_test
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5433:5432"
    volumes:
      - test_strapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  test_strapi_pgdata:
